    <script>
        let currentData = null;
        let eventSource = null;

        /**
         * Toggle active/inactive state
         */
        function toggleActive(checkbox) {
            const row = checkbox.closest('.player-row');
            if (checkbox.checked) {
                row.classList.remove('inactive');
            } else {
                row.classList.add('inactive');
            }
        }

        /**
         * Update a single row with data from CSV
         */
        function updateRow(rowElement, rowData, headers) {
            const rowNumber = parseInt(rowElement.getAttribute('data-row'));
            
            if (!rowData || rowNumber > currentData.rows.length) {
                return;
            }

            const row = currentData.rows[rowNumber - 1];

            // Update player name
            const imieIndex = headers.indexOf('Imię');
            const nazwiskoIndex = headers.indexOf('Nazwisko');
            const imie = imieIndex >= 0 ? (row[imieIndex] || '') : '';
            const nazwisko = nazwiskoIndex >= 0 ? (row[nazwiskoIndex] || '') : '';
            const displayName = [imie, nazwisko].filter(n => n).join(' ') || `Gracz ${rowNumber}`;
            
            const nameElement = rowElement.querySelector('.player-name');
            if (nameElement) {
                nameElement.textContent = displayName;
            }

            // Update player image
            const imgIndex = headers.indexOf('Img');
            const imgUrl = imgIndex >= 0 ? (row[imgIndex] || '') : '';
            const imgElement = rowElement.querySelector('.player-img-element');
            const imgPlaceholder = rowElement.querySelector('.player-img-placeholder');
            
            if (imgUrl && imgUrl.trim() !== '') {
                imgElement.src = imgUrl;
                imgElement.style.display = 'block';
                if (imgPlaceholder) imgPlaceholder.style.display = 'none';
            } else {
                imgElement.style.display = 'none';
                if (imgPlaceholder) imgPlaceholder.style.display = 'block';
            }

            // Update stat fields
            const fields = ['Garda', 'Wytrzymałość', 'Szok', 'Rany', 'Wyczerpanie', 'Kapsle'];
            fields.forEach(field => {
                const fieldIndex = headers.indexOf(field);
                const value = fieldIndex >= 0 ? (row[fieldIndex] || '0') : '0';
                const valueElement = rowElement.querySelector(`[data-field="${field}"]`);
                if (valueElement) {
                    valueElement.textContent = value;
                }
                
                // Special handling for Szok checkbox
                if (field === 'Szok') {
                    const szokValue = parseInt(value);
                    const checkbox = rowElement.querySelector('.szok-checkbox');
                    if (checkbox) {
                        checkbox.checked = szokValue === 1;
                        
                        // Update switch image
                        const label = checkbox.nextElementSibling;
                        const img = label ? label.querySelector('.switch-image') : null;
                        if (img) {
                            img.src = szokValue === 1 ? '/img/layout/switch_on.png' : '/img/layout/switch_off.png';
                        }
                    }
                }
            });

            // Update Karta input field
            const kartaIndex = headers.indexOf('Karta');
            const kartaValue = kartaIndex >= 0 ? (row[kartaIndex] || '') : '';
            const kartaInput = rowElement.querySelector('.karta-input[data-field="Karta"]');
            if (kartaInput) {
                kartaInput.value = kartaValue;
            }
        }

        /**
         * Update all rows
         */
        function updateAllRows(data) {
            if (!data || !data.rows || data.rows.length === 0) {
                return;
            }

            currentData = data;

            // Update each player row
            const rows = document.querySelectorAll('.player-row[data-row]');
            rows.forEach(rowElement => {
                updateRow(rowElement, data.rows, data.headers);
            });
        }

        /**
         * Toggle Szok checkbox and update switch image
         */
        function toggleSzok(checkbox) {
            const row = checkbox.dataset.row;
            const isChecked = checkbox.checked;
            const newValue = isChecked ? 1 : 0;
            
            // Update the switch image
            const label = checkbox.nextElementSibling;
            const img = label.querySelector('.switch-image');
            if (img) {
                img.src = isChecked ? '/img/layout/switch_on.png' : '/img/layout/switch_off.png';
            }
            
            // Update the backend
            modifyField(row, 'Szok', newValue - getCurrentSzokValue(row));
        }

        /**
         * Get current Szok value for a row
         */
        function getCurrentSzokValue(row) {
            const rowElement = document.querySelector(`.player-row[data-row="${row}"]`);
            if (!rowElement) return 0;
            
            const valueElement = rowElement.querySelector('[data-field="Szok"]');
            return valueElement ? parseInt(valueElement.textContent) || 0 : 0;
        }

        /**
         * Modify a field value
         */
        async function modifyField(row, field, delta) {
            try {
                const response = await fetch(`/api/modify?row=${row}&field=${field}&delta=${delta}`);
                const result = await response.json();
                
                if (result.success) {
                    console.log(`Modified row ${row}, ${field}: ${result.oldValue} → ${result.newValue}`);
                } else {
                    console.error('Modification failed:', result.error);
                }
            } catch (error) {
                console.error('Error modifying field:', error);
            }
        }

        /**
         * Parse card notation to extract figure and suit
         * Examples: "AH", "10D", "KC", "2S", "Joker R", "Joker U"
         */
        function parseCard(cardString) {
            if (!cardString || cardString.trim() === '') {
                return { figure: '', suit: '' };
            }
            
            const card = cardString.trim().toUpperCase();
            
            // Valid suits
            const validSuits = ['H', 'D', 'C', 'S', 'R', 'B', 'U'];
            
            let suit = '';
            let figure = card;
            
            const lastChar = card[card.length - 1];
            if (validSuits.includes(lastChar)) {
                suit = lastChar;
                figure = card.slice(0, -1).trim();
            } else {
                for (const s of validSuits) {
                    if (card.includes(s)) {
                        suit = s;
                        figure = card.replace(s, '').trim();
                        break;
                    }
                }
            }
            
            return { figure, suit };
        }

        /**
         * Get the suit image URL based on suit code
         */
        function getSuitImageUrl(suit) {
            const suitMap = {
                'H': '/img/cards/H.png',
                'D': '/img/cards/D.png',
                'C': '/img/cards/C.png',
                'S': '/img/cards/S.png',
                'R': '/img/cards/R.png',
                'U': '/img/cards/U.png',
                'B': '/img/cards/B.png'
            };
            
            return suitMap[suit] || '';
        }

        /**
         * Get the card figure image URL based on figure and suit
         */
        function getCardImageUrl(figure, suit) {
            if (!figure || !suit) return '';
            
            
            if (!['H', 'D', 'C', 'S', 'R', 'U', 'B'].includes(suit)) {
                return '';
            }
            
            return `/img/cards/${figure}_${suit}.png`;
        }

        /**
         * Update Karta field and parse card info
         */
        async function updateKarta(row, value) {
            console.log(`=== updateKarta called for row ${row} with value: "${value}" ===`);
            
            try {
                const cardInfo = parseCard(value);
                console.log('Parsed card info:', cardInfo);
                
                // Update Karta field
                console.log('Updating Karta field...');
                const kartaResponse = await fetch(`/api/modify-text?row=${row}&field=Karta&value=${encodeURIComponent(value)}`);
                const kartaResult = await kartaResponse.json();
                console.log('Karta update result:', kartaResult);
                
                if (!kartaResult.success) {
                    console.error('Failed to update Karta:', kartaResult.error);
                    return;
                }
                
                // Update pl-cd (card figure)
                if (cardInfo.figure) {
                    console.log(`Updating pl-cd to: ${cardInfo.figure}`);
                    const figureResponse = await fetch(`/api/modify-text?row=${row}&field=pl-cd&value=${encodeURIComponent(cardInfo.figure)}`);
                    const figureResult = await figureResponse.json();
                    console.log('pl-cd update result:', figureResult);
                }
                
                // Update pl-suit (card suit)
                if (cardInfo.suit) {
                    console.log(`Updating pl-suit to: ${cardInfo.suit}`);
                    const suitResponse = await fetch(`/api/modify-text?row=${row}&field=pl-suit&value=${encodeURIComponent(cardInfo.suit)}`);
                    const suitResult = await suitResponse.json();
                    console.log('pl-suit update result:', suitResult);
                }
                
                // Update Img3 (suit image URL)
                const suitImageUrl = getSuitImageUrl(cardInfo.suit);
                console.log(`Generated suit image URL (Img3): ${suitImageUrl}`);
                if (suitImageUrl) {
                    const img3Response = await fetch(`/api/modify-text?row=${row}&field=Img3&value=${encodeURIComponent(suitImageUrl)}`);
                    const img3Result = await img3Response.json();
                    console.log('Img3 update result:', img3Result);
                }
                
                // Update Img4 (card figure image URL)
                const cardImageUrl = getCardImageUrl(cardInfo.figure, cardInfo.suit);
                console.log(`Generated card image URL (Img4): ${cardImageUrl}`);
                if (cardImageUrl) {
                    const img4Response = await fetch(`/api/modify-text?row=${row}&field=Img4&value=${encodeURIComponent(cardImageUrl)}`);
                    const img4Result = await img4Response.json();
                    console.log('Img4 update result:', img4Result);
                }
                
                console.log(`=== updateKarta completed successfully for row ${row} ===`);
            } catch (error) {
                console.error('Error in updateKarta:', error);
            }
        }

        /**
         * Initialize SSE connection
         */
        function initSSE() {
            if (eventSource) {
                eventSource.close();
            }

            eventSource = new EventSource('/api/sse');

            eventSource.onmessage = (event) => {
                const data = JSON.parse(event.data);
                updateAllRows(data);
            };

            eventSource.onerror = (error) => {
                console.error('SSE Error:', error);
                eventSource.close();
                setTimeout(initSSE, 5000);
            };
        }

        /**
         * Initial load
         */
        async function init() {
            try {
                const response = await fetch('/api/data');
                const data = await response.json();
                updateAllRows(data);
                initSSE();
            } catch (error) {
                console.error('Error loading data:', error);
            }
        }

        // Start the app
        init();
    </script>
