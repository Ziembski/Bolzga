<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Control Row</title>
	<link rel="stylesheet" href="cockpit.css">
</head>
<body>


<div class="body-img">
<img src="/img/layout/body-bg.png">
</div>
		
<div class="players-container">
	<!-- 
		TEMPLATE: Duplicate this entire player-row div for each player
		Change data-row="1" to match your row number (1, 2, 3, etc.)
	-->
	<div class="player-row" data-row="1">
		<!-- IsActive Checkbox -->


		<!-- Player Info (IMG1 + Name) -->
		<div class="player-info">
			<div class="checkbox-container">
				<input type="checkbox" 
					   class="isactive-checkbox" 
					   id="checkbox-player1"
					   checked 
					   onchange="toggleActive(this)">
				<div class="checkbox-label">Active</div>
			</div>
			<div class="player-img">
				<img class="player-img-element" src="" alt="Player" style="display: none;">
				<span class="player-img-placeholder">IMG1</span>

			</div>
			<div class="player-name">Ładowanie...</div>
			<label for="checkbox-player1"></label>

		</div>

		<!-- Stats Container -->
		<div class="stats-container">
			<!-- Szok -->
			<div class="stat-item">
				<div class="stat-label">Szok</div>
				<div class="stat-control">
					<div class="arrow-btn arrow-up" 
						 onclick="modifyField(1, 'Szok', 1)"></div>
					<div class="stat-value" data-field="Szok">0</div>
					<div class="arrow-btn arrow-down" 
						 onclick="modifyField(1, 'Szok', -1)"></div>

				</div>
			</div>

			<!-- Rany -->
			<div class="stat-item">
				<div class="stat-label">Rany</div>
				<div class="stat-control">
					<div class="arrow-btn arrow-up" 
						 onclick="modifyField(1, 'Rany', 1)"></div>
					<div class="stat-value" data-field="Rany">0</div>
					<div class="arrow-btn arrow-down" 
						 onclick="modifyField(1, 'Rany', -1)"></div>
				</div>
			</div>

			<!-- Wyczerpanie -->
			<div class="stat-item">
				<div class="stat-label">Wyczerpanie</div>
				<div class="stat-control">
					<div class="arrow-btn arrow-up" 
						 onclick="modifyField(1, 'Wyczerpanie', 1)"></div>
					<div class="stat-value" data-field="Wyczerpanie">0</div>
					<div class="arrow-btn arrow-down" 
						 onclick="modifyField(1, 'Wyczerpanie', -1)"></div>
				</div>
			</div>

			<!-- Kapsle -->
			<div class="stat-item">
				<div class="stat-label">Kapsle</div>
				<div class="stat-control">


					<div class="arrow-btn arrow-up" 
						 onclick="modifyField(1, 'Kapsle', 1)"></div>
					<div class="stat-value" data-field="Kapsle">0</div>
					<div class="arrow-btn arrow-down" 
						 onclick="modifyField(1, 'Kapsle', -1)"></div>
				</div>
			</div>

			<!-- Karta -->
			<div class="stat-item karta-item">
				<div class="stat-label">Karta</div>
				<input type="text" 
					   class="karta-input" 
					   data-field="Karta"
					   data-row="2"
					   placeholder="Brak"
					   onchange="updateKarta(2, this.value)">
			</div>
		</div>
	</div>

</div>

    <script>
        let currentData = null;
        let eventSource = null;

        /**
         * Toggle active/inactive state with grayscale effect
         */
        function toggleActive(checkbox) {
            const row = checkbox.closest('.player-row');
            if (checkbox.checked) {
                row.classList.remove('inactive');
            } else {
                row.classList.add('inactive');
            }
        }

        /**
         * Update a single row with data from CSV
         */
        function updateRow(rowElement, rowData, headers) {
            const rowNumber = parseInt(rowElement.getAttribute('data-row'));
            
            if (!rowData || rowNumber > currentData.rows.length) {
                return;
            }

            const row = currentData.rows[rowNumber - 1];

            // Update player name
            const imieIndex = headers.indexOf('Imię');
            const nazwiskoIndex = headers.indexOf('Nazwisko');
            const imie = imieIndex >= 0 ? (row[imieIndex] || '') : '';
            const nazwisko = nazwiskoIndex >= 0 ? (row[nazwiskoIndex] || '') : '';
            const displayName = [imie, nazwisko].filter(n => n).join(' ') || `Gracz ${rowNumber}`;
            
            const nameElement = rowElement.querySelector('.player-name');
            if (nameElement) {
                nameElement.textContent = displayName;
            }

            // Update player image
            const imgIndex = headers.indexOf('Img');
            const imgUrl = imgIndex >= 0 ? (row[imgIndex] || '') : '';
            const imgElement = rowElement.querySelector('.player-img-element');
            const imgPlaceholder = rowElement.querySelector('.player-img-placeholder');
            
            if (imgUrl && imgUrl.trim() !== '') {
                imgElement.src = imgUrl;
                imgElement.style.display = 'block';
                if (imgPlaceholder) imgPlaceholder.style.display = 'none';
            } else {
                imgElement.style.display = 'none';
                if (imgPlaceholder) imgPlaceholder.style.display = 'block';
            }

            // Update stat fields
            const fields = ['Szok', 'Rany', 'Wyczerpanie', 'Kapsle'];
            fields.forEach(field => {
                const fieldIndex = headers.indexOf(field);
                const value = fieldIndex >= 0 ? (row[fieldIndex] || '0') : '0';
                const valueElement = rowElement.querySelector(`[data-field="${field}"]`);
                if (valueElement) {
                    valueElement.textContent = value;
                }
            });

            // Update Karta input field
            const kartaIndex = headers.indexOf('Karta');
            const kartaValue = kartaIndex >= 0 ? (row[kartaIndex] || '') : '';
            const kartaInput = rowElement.querySelector('.karta-input[data-field="Karta"]');
            if (kartaInput) {
                kartaInput.value = kartaValue;
            }
        }

        /**
         * Update all rows
         */
        function updateAllRows(data) {
            if (!data || !data.rows || data.rows.length === 0) {
                return;
            }

            currentData = data;

            // Update each player row
            const rows = document.querySelectorAll('.player-row[data-row]');
            rows.forEach(rowElement => {
                updateRow(rowElement, data.rows, data.headers);
            });
        }

        /**
         * Modify a field value
         */
        async function modifyField(row, field, delta) {
            try {
                const response = await fetch(`/api/modify?row=${row}&field=${field}&delta=${delta}`);
                const result = await response.json();
                
                if (result.success) {
                    console.log(`Modified row ${row}, ${field}: ${result.oldValue} → ${result.newValue}`);
                } else {
                    console.error('Modification failed:', result.error);
                }
            } catch (error) {
                console.error('Error modifying field:', error);
            }
        }

        /**
         * Update Karta field and parse card info
         */
        async function updateKarta(row, value) {
            try {
                // Parse the card value to extract figure and suit
                const cardInfo = parseCard(value);
                
                // Update Karta field
                const kartaResponse = await fetch(`/api/modify-text?row=${row}&field=Karta&value=${encodeURIComponent(value)}`);
                const kartaResult = await kartaResponse.json();
                
                if (!kartaResult.success) {
                    console.error('Failed to update Karta:', kartaResult.error);
                    return;
                }
                
                // Update pl-cd (card figure)
                if (cardInfo.figure) {
                    const figureResponse = await fetch(`/api/modify-text?row=${row}&field=pl-cd&value=${encodeURIComponent(cardInfo.figure)}`);
                    const figureResult = await figureResponse.json();
                    if (figureResult.success) {
                        console.log(`Updated pl-cd to: ${cardInfo.figure}`);
                    }
                }
                
                // Update pl-suit (card suit)
                if (cardInfo.suit) {
                    const suitResponse = await fetch(`/api/modify-text?row=${row}&field=pl-suit&value=${encodeURIComponent(cardInfo.suit)}`);
                    const suitResult = await suitResponse.json();
                    if (suitResult.success) {
                        console.log(`Updated pl-suit to: ${cardInfo.suit}`);
                    }
                }
                
                console.log(`Updated Karta for row ${row}: ${value}`);
            } catch (error) {
                console.error('Error updating Karta:', error);
            }
        }

        /**
         * Parse card notation to extract figure and suit
         * Examples: "AH", "10D", "KC", "2S", "Joker R", "Joker U"
         */
        function parseCard(cardString) {
            if (!cardString || cardString.trim() === '') {
                return { figure: '', suit: '' };
            }
            
            const card = cardString.trim().toUpperCase();
            
            // Handle Jokers
            if (card.includes('JOKER')) {
                if (card.includes('R') || card.includes('RED') || card.includes('CZERWONY')) {
                    return { figure: 'Joker', suit: 'R' }; // R for Red Joker
                } else if (card.includes('U') || card.includes('BLUE') || card.includes('NIEBIESKI')) {
                    return { figure: 'Joker', suit: 'U' }; // U for blUe Joker
                } else if (card.includes('B') || card.includes('BLACK') || card.includes('CZARNY')) {
                    return { figure: 'Joker', suit: 'B' }; // B for Black Joker
                } else {
                    return { figure: 'Joker', suit: 'R' }; // Default to Red
                }
            }
            
            // Valid suits in letter notation
            const validSuits = ['H', 'D', 'C', 'S', 'R', 'B', 'U'];
            
            // Try to find suit as last character
            let suit = '';
            let figure = card;
            
            const lastChar = card[card.length - 1];
            if (validSuits.includes(lastChar)) {
                suit = lastChar;
                figure = card.slice(0, -1).trim();
            } else {
                // Try to find suit anywhere in string
                for (const s of validSuits) {
                    if (card.includes(s)) {
                        suit = s;
                        figure = card.replace(s, '').trim();
                        break;
                    }
                }
            }
            
            return { figure, suit };
        }

        /**
         * Initialize SSE connection
         */
        function initSSE() {
            if (eventSource) {
                eventSource.close();
            }

            eventSource = new EventSource('/api/sse');

            eventSource.onmessage = (event) => {
                const data = JSON.parse(event.data);
                updateAllRows(data);
            };

            eventSource.onerror = (error) => {
                console.error('SSE Error:', error);
                eventSource.close();
                setTimeout(initSSE, 5000);
            };
        }

        /**
         * Initial load
         */
        async function init() {
            try {
                const response = await fetch('/api/data');
                const data = await response.json();
                updateAllRows(data);
                initSSE();
            } catch (error) {
                console.error('Error loading data:', error);
            }
        }

        // Start the app
        init();
    </script>
</body>
</html>
